name: Test invalid market-type value
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          mode: start
          github-token: ${{ github.token }}
          ec2-instance-type: t3.micro
          ec2-image-id: ami-0123456789abcdef0
          subnet-id: subnet-0123456789abcdef0
          security-group-id: sg-0123456789abcdef0
          market-type: on-demand

      - name: Assert action failed due to invalid market-type
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail when market-type is invalid"
            exit 1
          fi
          echo "PASS: action correctly failed with invalid market-type"
