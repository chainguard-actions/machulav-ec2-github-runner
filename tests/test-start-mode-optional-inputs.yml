name: Test start mode with optional inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: AKIAIOSFODNN7EXAMPLE
      AWS_SECRET_ACCESS_KEY: wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY
      AWS_DEFAULT_REGION: us-east-1
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action in start mode with optional inputs (expect failure due to invalid credentials)
        id: action
        uses: .
        continue-on-error: true
        with:
          mode: start
          github-token: fake-github-token-for-testing
          ec2-image-id: ami-0123456789abcdef0
          ec2-instance-type: t3.micro
          subnet-id: subnet-0123456789abcdef0
          security-group-id: sg-0123456789abcdef0
          iam-role-name: MyEC2RunnerRole
          market-type: spot
          aws-resource-tags: '[{"Key": "Environment", "Value": "test"}, {"Key": "Project", "Value": "ci"}]'
          pre-runner-script: |
            apt-get update -y
            apt-get install -y git
          startup-timeout-minutes: '3'
          runner-debug: 'false'
          use-jit: 'false'

      - name: Assert action failed (expected with invalid credentials)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid credentials, but got outcome: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed with invalid credentials when using optional inputs"
