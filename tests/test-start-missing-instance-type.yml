name: Test start mode missing ec2-instance-type
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          mode: start
          github-token: ${{ github.token }}
          ec2-image-id: ami-0123456789abcdef0
          subnet-id: subnet-0123456789abcdef0
          security-group-id: sg-0123456789abcdef0
          # ec2-instance-type is intentionally omitted

      - name: Assert action failed due to missing ec2-instance-type
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail when ec2-instance-type is missing in start mode"
            exit 1
          fi
          echo "PASS: action correctly failed when ec2-instance-type is missing"
