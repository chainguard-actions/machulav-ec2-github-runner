name: Test start mode fails with missing required inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run action in start mode without required EC2 inputs
        id: action
        uses: .
        continue-on-error: true
        with:
          mode: start
          github-token: ${{ github.token }}
          ec2-instance-type: t3.micro
          # Intentionally omitting ec2-image-id, subnet-id, security-group-id
          # and availability-zones-config to trigger validation error
      - name: Assert action failed due to missing inputs
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail when required inputs are missing"
            exit 1
          fi
          echo "PASS: action correctly failed when required inputs were missing"
