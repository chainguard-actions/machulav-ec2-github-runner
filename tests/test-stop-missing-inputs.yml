name: Test stop mode fails without required inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action in stop mode without label and ec2-instance-id (expect failure)
        id: action
        uses: .
        continue-on-error: true
        with:
          mode: stop
          github-token: fake-token-for-testing
          # Intentionally omitting label and ec2-instance-id
          # to trigger validation failure

      - name: Assert action failed due to missing stop inputs
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail when label and ec2-instance-id are missing in stop mode"
            exit 1
          fi
          echo "PASS: action correctly failed when required stop inputs are missing"
