name: Test start mode with optional inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set fake AWS credentials
        run: |
          echo "AWS_ACCESS_KEY_ID=AKIAIOSFODNN7EXAMPLE" >> $GITHUB_ENV
          echo "AWS_SECRET_ACCESS_KEY=wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY" >> $GITHUB_ENV
          echo "AWS_DEFAULT_REGION=us-east-1" >> $GITHUB_ENV
      - id: action
        uses: .
        continue-on-error: true
        with:
          mode: start
          github-token: ${{ github.token }}
          ec2-image-id: ami-0123456789abcdef0
          ec2-instance-type: t3.micro
          subnet-id: subnet-0123456789abcdef0
          security-group-id: sg-0123456789abcdef0
          iam-role-name: MyEC2RunnerRole
          market-type: spot
          pre-runner-script: |
            echo "pre-runner setup"
            apt-get update -y
          runner-home-dir: /home/runner/actions-runner
          startup-quiet-period-seconds: 10
          startup-retry-interval-seconds: 5
          startup-timeout-minutes: 2
          block-device-mappings: '[{"DeviceName": "/dev/sda1", "Ebs": {"VolumeSize": 50, "VolumeType": "gp3"}}]'
          ec2-volume-size: '50'
          ec2-volume-type: gp3
          metadata-options: '{"HttpTokens": "required", "HttpEndpoint": "enabled"}'
          run-runner-as-user: runner
          aws-resource-tags: '[{"Key": "Environment", "Value": "test"}]'
      - name: Assert action ran (may fail due to no real AWS)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action is expected to fail (no real AWS credentials/resources),
          # but it must have run (not skipped)
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped, expected it to run"
            exit 1
          fi
          echo "PASS: action ran with optional inputs"
