name: Test start mode with advanced instance options
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action in start mode with advanced options
        id: action
        uses: .
        continue-on-error: true
        with:
          mode: start
          github-token: ${{ github.token }}
          ec2-image-id: ami-00000000000000000
          ec2-instance-type: t3.micro
          subnet-id: subnet-00000000000000000
          security-group-id: sg-00000000000000000
          iam-role-name: my-ec2-runner-role
          runner-home-dir: /home/runner/actions-runner
          pre-runner-script: |
            apt-get update -y
            apt-get install -y curl
          run-runner-as-user: runner
          startup-quiet-period-seconds: '10'
          startup-retry-interval-seconds: '5'
          startup-timeout-minutes: '1'
          ec2-volume-size: '50'
          ec2-volume-type: gp3
          block-device-mappings: >-
            [{"DeviceName": "/dev/sda1", "Ebs": {"VolumeSize": 50, "VolumeType": "gp3"}}]
          metadata-options: >-
            {"HttpTokens": "required", "HttpEndpoint": "enabled", "HttpPutResponseHopLimit": 2}
        env:
          AWS_ACCESS_KEY_ID: AKIAIOSFODNN7EXAMPLE
          AWS_SECRET_ACCESS_KEY: wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY
          AWS_DEFAULT_REGION: us-east-1

      - name: Assert action failed due to invalid AWS credentials
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" = "success" ]; then
            echo "FAIL: expected action to fail with invalid AWS credentials"
            exit 1
          fi
          echo "PASS: action failed as expected (invalid AWS credentials with advanced options)"
