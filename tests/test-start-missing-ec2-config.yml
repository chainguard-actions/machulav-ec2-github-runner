name: Test start mode fails without EC2 config
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action in start mode without EC2 config (expect failure)
        id: action
        uses: .
        continue-on-error: true
        with:
          mode: start
          github-token: fake-token-for-testing
          ec2-instance-type: t3.micro
          # Intentionally omitting ec2-image-id, subnet-id, security-group-id
          # to trigger validation failure

      - name: Assert action failed due to missing EC2 config
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail when EC2 config is missing"
            exit 1
          fi
          echo "PASS: action correctly failed when EC2 config is missing"
