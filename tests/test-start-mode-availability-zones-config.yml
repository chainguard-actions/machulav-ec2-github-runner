name: Test start mode with availability-zones-config
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: AKIAIOSFODNN7EXAMPLE
      AWS_SECRET_ACCESS_KEY: wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY
      AWS_DEFAULT_REGION: us-east-1
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action in start mode with availability-zones-config (expect failure due to invalid credentials)
        id: action
        uses: .
        continue-on-error: true
        with:
          mode: start
          github-token: fake-github-token-for-testing
          availability-zones-config: >-
            [{"imageId":"ami-0123456789abcdef0","subnetId":"subnet-0123456789abcdef0","securityGroupId":"sg-0123456789abcdef0"},{"imageId":"ami-abcdef0123456789","subnetId":"subnet-abcdef0123456789","securityGroupId":"sg-abcdef0123456789","region":"us-west-2"}]
          ec2-instance-type: t3.micro

      - name: Assert action failed (expected with invalid credentials)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid credentials, but got outcome: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed with invalid credentials when using availability-zones-config"
