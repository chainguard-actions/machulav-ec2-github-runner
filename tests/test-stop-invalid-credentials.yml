name: Test stop mode fails with invalid AWS credentials
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: AKIAIOSFODNN7EXAMPLE
      AWS_SECRET_ACCESS_KEY: wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY
      AWS_DEFAULT_REGION: us-east-1
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run action in stop mode with fake credentials
        id: action
        uses: .
        continue-on-error: true
        with:
          mode: stop
          github-token: ${{ github.token }}
          label: fake-runner-label-12345
          ec2-instance-id: i-0123456789abcdef0
      - name: Assert action failed due to invalid AWS credentials
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid AWS credentials"
            exit 1
          fi
          echo "PASS: action correctly failed with invalid AWS credentials"
