name: Test start mode with all optional inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          mode: start
          github-token: ghp_fakegithubtoken1234567890abcdefghij
          ec2-image-id: ami-0123456789abcdef0
          ec2-instance-type: t3.micro
          subnet-id: subnet-0123456789abcdef0
          security-group-id: sg-0123456789abcdef0
          iam-role-name: my-runner-role
          runner-home-dir: /home/runner/actions-runner
          pre-runner-script: echo "pre-runner setup"
          market-type: spot
          block-device-mappings: '[{"DeviceName": "/dev/sda1", "Ebs": {"VolumeSize": 100, "VolumeType": "gp3"}}]'
          startup-quiet-period-seconds: '10'
          startup-retry-interval-seconds: '5'
          startup-timeout-minutes: '5'
          run-runner-as-service: 'false'
          run-runner-as-user: runner
          ec2-volume-size: '50'
          ec2-device-name: /dev/sda1
          ec2-volume-type: gp3
          metadata-options: '{"HttpTokens": "required", "HttpEndpoint": "enabled"}'
          aws-resource-tags: '[{"Key": "Environment", "Value": "test"}]'
        env:
          AWS_ACCESS_KEY_ID: AKIAIOSFODNN7EXAMPLE
          AWS_SECRET_ACCESS_KEY: wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY
          AWS_REGION: us-east-1
      - name: Assert action ran (expected to fail without real credentials)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded (unexpected but acceptable)"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed as expected without real AWS credentials"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
          echo "PASS"
