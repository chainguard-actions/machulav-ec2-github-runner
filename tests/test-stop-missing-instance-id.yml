name: Test stop mode missing ec2-instance-id
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          mode: stop
          github-token: ${{ github.token }}
          label: some-runner-label
          # ec2-instance-id is intentionally omitted

      - name: Assert action failed due to missing ec2-instance-id
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail when ec2-instance-id is missing in stop mode"
            exit 1
          fi
          echo "PASS: action correctly failed when ec2-instance-id is missing in stop mode"
