name: Test action fails with invalid mode input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run action with invalid mode
        id: action
        uses: .
        continue-on-error: true
        with:
          mode: invalid-mode
          github-token: ${{ github.token }}
      - name: Assert action failed due to invalid mode
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid mode 'invalid-mode'"
            exit 1
          fi
          echo "PASS: action correctly failed with invalid mode"
