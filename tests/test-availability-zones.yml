name: Test availability-zones-config and related inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        env:
          AWS_REGION: us-east-1
          AWS_ACCESS_KEY_ID: AKIAIOSFODNN7EXAMPLE
          AWS_SECRET_ACCESS_KEY: wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY
        with:
          mode: start
          github-token: ghp_fake_token_for_testing_only
          availability-zones-config: >-
            [{"imageId":"ami-0123456789abcdef0","subnetId":"subnet-0123456789abcdef0","securityGroupId":"sg-0123456789abcdef0"},{"imageId":"ami-abcdef0123456789","subnetId":"subnet-abcdef0123456789","securityGroupId":"sg-abcdef0123456789","region":"us-west-2"}]
          ec2-instance-type: t3.micro
          market-type: spot
          iam-role-name: MyEC2RunnerRole
          metadata-options: '{"HttpTokens":"required","HttpEndpoint":"enabled","HttpPutResponseHopLimit":2,"InstanceMetadataTags":"enabled"}'
          run-runner-as-user: runner
          startup-timeout-minutes: '1'
      - name: Assert action ran (may fail due to missing real AWS credentials)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          # The action is expected to fail without real AWS credentials/resources.
          # We just verify it ran (not skipped) and produced a recognizable outcome.
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action ran with outcome=$OUTCOME (failure expected without real AWS)"
