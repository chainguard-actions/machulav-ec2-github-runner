name: Test start mode missing network configuration
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          mode: start
          github-token: ${{ github.token }}
          ec2-instance-type: t3.micro
          # ec2-image-id, subnet-id, security-group-id are all omitted
          # and no availability-zones-config is provided

      - name: Assert action failed due to missing network config
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail when network config is missing in start mode"
            exit 1
          fi
          echo "PASS: action correctly failed when network configuration is missing"
