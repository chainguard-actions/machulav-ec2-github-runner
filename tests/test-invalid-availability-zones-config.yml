name: Test invalid availability-zones-config JSON
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          mode: start
          github-token: ${{ github.token }}
          ec2-instance-type: t3.micro
          availability-zones-config: 'not-valid-json'

      - name: Assert action failed due to invalid JSON in availability-zones-config
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail when availability-zones-config is invalid JSON"
            exit 1
          fi
          echo "PASS: action correctly failed with invalid availability-zones-config JSON"
