name: Test start mode with extended optional inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        env:
          AWS_ACCESS_KEY_ID: AKIAIOSFODNN7EXAMPLE
          AWS_SECRET_ACCESS_KEY: wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY
          AWS_DEFAULT_REGION: us-east-1
        with:
          mode: start
          github-token: ${{ github.token }}
          ec2-image-id: ami-0123456789abcdef0
          ec2-instance-type: t3.micro
          subnet-id: subnet-0123456789abcdef0
          security-group-id: sg-0123456789abcdef0
          runner-home-dir: /home/runner/actions-runner
          run-runner-as-user: runner
          startup-quiet-period-seconds: '10'
          startup-retry-interval-seconds: '5'
          startup-timeout-minutes: '1'
          block-device-mappings: '[{"DeviceName": "/dev/sda1", "Ebs": {"VolumeSize": 50, "VolumeType": "gp3"}}]'
          ec2-volume-size: '50'
          ec2-volume-type: gp3
          metadata-options: '{"HttpTokens": "required", "HttpEndpoint": "enabled"}'
      - name: Assert action ran (failed due to invalid credentials as expected)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with extended optional inputs (outcome=$OUTCOME)"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
