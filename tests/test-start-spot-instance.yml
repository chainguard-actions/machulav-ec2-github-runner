name: Test start mode - spot instance market type
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action in start mode requesting a spot instance
        id: action
        uses: .
        continue-on-error: true
        with:
          mode: start
          github-token: ${{ github.token }}
          ec2-image-id: ami-00000000000000000
          ec2-instance-type: t3.micro
          subnet-id: subnet-00000000000000000
          security-group-id: sg-00000000000000000
          market-type: spot
          aws-resource-tags: >-
            [{"Key": "Environment", "Value": "test"}, {"Key": "Project", "Value": "ci"}]
        env:
          AWS_ACCESS_KEY_ID: AKIAIOSFODNN7EXAMPLE
          AWS_SECRET_ACCESS_KEY: wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY
          AWS_DEFAULT_REGION: us-east-1

      - name: Assert action failed due to invalid AWS credentials
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" = "success" ]; then
            echo "FAIL: expected action to fail with invalid AWS credentials"
            exit 1
          fi
          echo "PASS: action failed as expected (invalid AWS credentials/spot request)"
