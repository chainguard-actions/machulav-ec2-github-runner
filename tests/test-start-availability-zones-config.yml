name: Test start mode with availability-zones-config fails without real AWS
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run action with availability-zones-config (expect failure with fake creds)
        id: action
        uses: .
        continue-on-error: true
        with:
          mode: start
          github-token: fake-github-token
          ec2-instance-type: t3.micro
          availability-zones-config: >-
            [{"imageId":"ami-00000000000000000","subnetId":"subnet-00000000000000000","securityGroupId":"sg-00000000000000000","region":"us-east-1"},{"imageId":"ami-11111111111111111","subnetId":"subnet-11111111111111111","securityGroupId":"sg-11111111111111111","region":"us-west-2"}]
        env:
          AWS_ACCESS_KEY_ID: AKIAIOSFODNN7EXAMPLE
          AWS_SECRET_ACCESS_KEY: wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY
          AWS_DEFAULT_REGION: us-east-1
      - name: Assert action failed (no real AWS credentials)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with fake AWS credentials, but got outcome '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed when using availability-zones-config with fake credentials"
